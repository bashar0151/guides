name: Build and deploy wiki
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-wiki
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for "last modified"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bashar0151/guides:latest
            ghcr.io/bashar0151/guides:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tell Coolify to deploy
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" "${{ secrets.COOLIFY_WEBHOOK }}"
